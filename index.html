        // HELPER FUNCTIONS FOR EXPIRY & CLEANUP
        const getPlanDays = (itemName) => {
            if (!itemName) return 30;
            const lower = itemName.toLowerCase();
            
            if (lower.includes('proxy') || lower.includes('gb')) return 30;
            if (lower.includes('7') || lower.includes('week')) return 7;
            if (lower.includes('1 month') || lower.includes('30')) return 30;
            if (lower.includes('2 month') || lower.includes('60')) return 60;
            if (lower.includes('3 month') || lower.includes('90')) return 90;
            if (lower.includes('6 month') || lower.includes('180')) return 180;
            if (lower.includes('1 year') || lower.includes('365') || lower.includes('12 month') || lower.includes('year')) return 365;
            
            // Try to find any standalone number in the plan name
            const match = lower.match(/\b(\d+)\b/);
            if (match) {
                let num = parseInt(match[1]);
                if(num <= 365) return num;
            }
            
            return 30; // default assumption
        };

        const getExpiryStatus = (order) => {
            if (order.status !== 'Delivered') return null;
            const days = getPlanDays(order.item);
            const start = order.deliveredAt || order.timestamp;
            const expiryTs = start + (days * 86400000);
            const now = Date.now();
            const leftMs = expiryTs - now;
            const leftDays = Math.ceil(leftMs / 86400000);
            return { expired: leftDays <= 0, daysLeft: leftDays, expiryTs };
        };

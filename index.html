        // HELPER FUNCTIONS FOR EXPIRY & CLEANUP
        const getPlanDays = (itemName) => {
            if (!itemName) return 30;
            const lower = itemName.toLowerCase();
            
            if (lower.includes('proxy') || lower.includes('gb')) return 30;
            if (lower.includes('7') || lower.includes('week')) return 7;
            if (lower.includes('1 month') || lower.includes('30')) return 30;
            if (lower.includes('2 month') || lower.includes('60')) return 60;
            if (lower.includes('3 month') || lower.includes('90')) return 90;
            if (lower.includes('6 month') || lower.includes('180')) return 180;
            if (lower.includes('1 year') || lower.includes('365') || lower.includes('12 month') || lower.includes('year')) return 365;
            
            // Try to find any standalone number in the plan name
            const match = lower.match(/\b(\d+)\b/);
            if (match) {
                let num = parseInt(match[1]);
                if(num <= 365) return num;
            }
            
            return 30; // default assumption
        };

        const getExpiryStatus = (order) => {
            if (order.status !== 'Delivered') return null;
            const days = getPlanDays(order.item);
            const start = order.deliveredAt || order.timestamp;
            const expiryTs = start + (days * 86400000);
            const now = Date.now();
            const leftMs = expiryTs - now;
            const leftDays = Math.ceil(leftMs / 86400000);
            return { expired: leftDays <= 0, daysLeft: leftDays, expiryTs };
        };

                                                                isEnglish ? (
                                                                    <>
                                                                        <li>Open your Binance app and go to <span className="font-bold text-yellow-300">Assets</span>.</li>
                                                                        <li>Click <span className="font-bold text-yellow-300">"Send"</span> and select <span className="font-bold text-yellow-300">"Send to Binance users"</span>.</li>
                                                                        <li>Enter this Binance Pay ID/Email as the recipient: 
                                                                            <div className="font-bold text-sm text-yellow-300 mt-1 flex items-center gap-2 -ml-4">
                                                                                <span>{payMethod.number}</span> 
                                                                                <button onClick={()=>handleCopy(payMethod.number)} className="bg-black/20 px-2 py-0.5 rounded flex items-center gap-1 text-[10px]"><Icons.Copy size={12}/> Copy</button>
                                                                            </div>
                                                                        </li>
                                                                        <li>Amount to send: <span className="font-bold text-yellow-300">${( (modal.type === 'deposit' ? modal.amount : Math.max(0, modal.plan.price - discountAmount)) / usdRate ).toFixed(2)}</span></li>
                                                                        <li>After sending, copy the <span className="font-bold text-yellow-300">Transaction Hash/ID</span>.</li>
                                                                        <li>Paste the Transaction Hash in the box above and click VERIFY.</li>
                                                                    </>
                                                                ) : (
                                                                    <>
                                                                        <li>আপনার Binance অ্যাপে প্রবেশ করে <span className="font-bold text-yellow-300">Assets</span>-এ যান।</li>
                                                                        <li><span className="font-bold text-yellow-300">"Send"</span> -এ ক্লিক করে <span className="font-bold text-yellow-300">"Send to Binance users"</span> সিলেক্ট করুন।</li>
                                                                        <li>প্রাপক হিসেবে এই Binance Pay ID/Email লিখুন: 
                                                                            <div className="font-bold text-sm text-yellow-300 mt-1 flex items-center gap-2 -ml-4">
                                                                                <span>{payMethod.number}</span> 
                                                                                <button onClick={()=>handleCopy(payMethod.number)} className="bg-black/20 px-2 py-0.5 rounded flex items-center gap-1 text-[10px]"><Icons.Copy size={12}/> Copy</button>
                                                                            </div>
                                                                        </li>
                                                                        <li>টাকার পরিমাণ: <span className="font-bold text-yellow-300">${( (modal.type === 'deposit' ? modal.amount : Math.max(0, modal.plan.price - discountAmount)) / usdRate ).toFixed(2)}</span></li>
                                                                        <li>সেন্ড করার পর <span className="font-bold text-yellow-300">Transaction Hash/ID</span> টি কপি করুন।</li>
                                                                        <li>এখন উপরের বক্সে আপনার Transaction Hash দিন এবং নিচের VERIFY বাটনে ক্লিক করুন।</li>
                                                                    </>
                                                                )
                                                            ) : (
                                                                isEnglish ? (
                                                                    <>
                                                                        <li>Go to your {payMethod.name} app or dial the USSD code.</li>
                                                                        <li>Click on <span className="font-bold text-yellow-300">"Send Money"</span>.</li>
                                                                        <li>Enter this number as the recipient: 
                                                                            <div className="font-bold text-sm text-yellow-300 mt-1 flex items-center gap-2 -ml-4">
                                                                                <span>{payMethod.number}</span> 
                                                                                <button onClick={()=>handleCopy(payMethod.number)} className="bg-black/20 px-2 py-0.5 rounded flex items-center gap-1 text-[10px]"><Icons.Copy size={12}/> Copy</button>
                                                                            </div>
                                                                        </li>
                                                                        <li>Amount to send: <span className="font-bold text-yellow-300">{modal.type === 'deposit' ? modal.amount : Math.max(0, modal.plan.price - discountAmount)}</span></li>
                                                                        <li>Enter your {payMethod.name} mobile menu PIN to confirm.</li>
                                                                        <li>If everything is correct, you will receive a confirmation message from {payMethod.name}.</li>
                                                                        <li>Now enter your Transaction ID in the box above and click the VERIFY button.</li>
                                                                    </>
                                                                ) : (
                                                                    <>
                                                                        <li>আপনার {payMethod.name} অ্যাপে যান অথবা USSD কোড ডায়াল করুন।</li>
                                                                        <li><span className="font-bold text-yellow-300">"Send Money"</span> -এ ক্লিক করুন।</li>
                                                                        <li>প্রাপক নম্বর হিসেবে এই নম্বরটি লিখুন: 
                                                                            <div className="font-bold text-sm text-yellow-300 mt-1 flex items-center gap-2 -ml-4">
                                                                                <span>{payMethod.number}</span> 
                                                                                <button onClick={()=>handleCopy(payMethod.number)} className="bg-black/20 px-2 py-0.5 rounded flex items-center gap-1 text-[10px]"><Icons.Copy size={12}/> Copy</button>
                                                                            </div>
                                                                        </li>
                                                                        <li>টাকার পরিমাণ: <span className="font-bold text-yellow-300">{modal.type === 'deposit' ? modal.amount : Math.max(0, modal.plan.price - discountAmount)}</span></li>
                                                                        <li>নিশ্চিত করতে এখন আপনার {payMethod.name} মোবাইল মেন্যু পিন লিখুন।</li>
                                                                        <li>সবকিছু ঠিক থাকলে, আপনি {payMethod.name} থেকে একটি নিশ্চিতকরণ বার্তা পাবেন।</li>
                                                                        <li>এখন উপরের বক্সে আপনার Transaction ID দিন এবং নিচের VERIFY বাটনে ক্লিক করুন।</li>
                                                                    </>
                                                                )
                                                            )}
                                                        </ul>
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div className="flex gap-2 mt-4">
                                                <button onClick={()=>setPayStep(1)} className="px-4 py-3 rounded-xl font-bold border text-gray-500 bg-white shadow-sm"><Icons.ArrowLeft size={20}/></button>
                                                <button 
                                                    onClick={payMethod.type === 'wallet' ? finalizeOrder : (modal.type === 'deposit' ? finalizeDeposit : finalizeOrder)} 
                                                    disabled={isSubmitting || (payMethod.type === 'wallet' && walletBalance < Math.max(0, modal.plan.price - discountAmount))} 
                                                    className={`flex-1 text-white py-3.5 rounded-xl font-bold shadow-lg transition disabled:opacity-50 ${payMethod.type === 'wallet' ? 'bg-emerald-600 hover:bg-emerald-700' : 'bg-red-700 hover:bg-red-800'}`}
                                                >
                                                    {isSubmitting ? 'Processing...' : (payMethod.type === 'wallet' ? 'Pay Instantly' : 'VERIFY')}
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {payStep === 3 && (
                                        <div className="space-y-4 animate-slide-in">
                                            <div className="text-center mb-4">
                                                <div className="w-16 h-16 bg-yellow-100 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-2"><Icons.Alert size={32}/></div>
                                                <h3 className="font-bold text-lg">Confirm Payment?</h3>
                                                <p className="text-xs text-gray-500">Please double check your details.</p>
                                            </div>
                                            <div className="bg-gray-50 p-3 rounded-lg text-sm space-y-2 border">
                                                <div className="flex justify-between"><span>Type:</span> <span className="font-bold">{modal.type === 'deposit' ? 'Add Funds' : modal.plan.name}</span></div>
                                                <div className="flex justify-between"><span>Amount:</span> <span className="font-bold">৳{modal.type === 'deposit' ? modal.amount : Math.max(0, modal.plan.price - discountAmount)}</span></div>
                                                <div className="flex justify-between"><span>Method:</span> <span className="font-bold">{payMethod?.name}</span></div>
                                                <div className="flex justify-between"><span>TrxID:</span> <span className="font-mono font-bold">{trxId}</span></div>
                                            </div>
                                            <div className="flex gap-2">
                                                <button onClick={()=>setPayStep(2)} disabled={isSubmitting} className="flex-1 py-3 rounded-xl font-bold border text-gray-500">Back</button>
                                                <button onClick={modal.type === 'deposit' ? finalizeDeposit : finalizeOrder} disabled={isSubmitting} className="flex-1 py-3 rounded-xl font-bold bg-blue-600 text-white shadow-lg disabled:opacity-50">
                                                    {isSubmitting ? 'Processing...' : 'Confirm'}
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {payStep === 4 && (
                                        <div className="text-center animate-slide-up py-4">
                                            <div className="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4 animate-bounce"><Icons.Check size={40}/></div>
                                            <h3 className="text-xl font-bold text-slate-800">{modal.type === 'deposit' ? 'Deposit Request Sent!' : (payMethod?.type === 'wallet' ? 'Order Successful!' : 'Order Submitted!')}</h3>
                                            <p className="text-sm text-gray-500 mb-4">{payMethod?.type === 'wallet' ? 'Your VPN is ready in the Orders tab.' : 'We will verify and process shortly.'}</p>
                                            
                                            {modal.type !== 'deposit' && payMethod?.type !== 'wallet' && recentPendingOrder && (() => {
                                                const elapsed = Math.floor((now - recentPendingOrder.timestamp) / 1000);
                                                const left = Math.max(0, 300 - elapsed);
                                                if (left > 0) {
                                                    const m = Math.floor(left/60);
                                                    const s = ('0' + (left%60)).slice(-2);
                                                    return (
                                                        <div className="bg-blue-50 text-blue-600 p-4 rounded-2xl mb-6 font-bold flex flex-col items-center justify-center border border-blue-200 shadow-sm animate-pulse">
                                                            <span className="text-[10px] text-blue-500 mb-1 uppercase tracking-widest font-black">Estimated Wait Time</span>
                                                            <div className="flex items-center gap-2 text-3xl tracking-wider"><Icons.Clock size={28}/> {m}:{s}</div>
                                                        </div>
                                                    );
                                                }
                                                return null;
                                            })()}

                                            <div className="space-y-2">
                                                <button onClick={()=>{setModal(null); setTrxId(''); setSelectedProduct(null); setActiveTab(modal.type === 'deposit' ? 'wallet' : 'orders');}} className="w-full py-3.5 rounded-xl font-bold bg-slate-900 text-white shadow-lg hover:bg-slate-800 transition">View Details</button>
                                                <a href={`https://t.me/${settings.adminUsername}`} onClick={handleAdminContact} target={recentPendingOrder ? "_self" : "_blank"} className="block w-full py-3.5 rounded-xl font-bold text-blue-600 bg-blue-50 flex items-center justify-center gap-2">
                                                    <Icons.Message size={18}/> Message Admin
                                                </a>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}
                    {showPopupNotice && popupNotice && popupNotice.text && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 animate-fade-in" onClick={()=>setShowPopupNotice(false)}>
                            <div className="bg-white dark:bg-slate-800 w-full max-w-sm rounded-3xl shadow-2xl overflow-hidden animate-slide-up" onClick={e=>e.stopPropagation()}>
                                {/* Top colored bar */}
                                <div className="bg-gradient-to-r from-blue-500 to-indigo-600 px-5 pt-6 pb-5 relative overflow-hidden">
                                    <div className="absolute -top-4 -right-4 w-24 h-24 bg-white/10 rounded-full"></div>
                                    <div className="absolute -bottom-6 -left-4 w-20 h-20 bg-white/10 rounded-full"></div>
                                    <div className="relative flex items-center gap-3">
                                        <div className="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center flex-shrink-0 shadow-lg backdrop-blur-sm">
                                            {/* Bell with waves notice icon */}
                                            <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                                                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                                                <line x1="2" y1="2" x2="22" y2="22" style={{display:'none'}}/>
                                            </svg>
                                        </div>
                                        <div>
                                            <div className="text-white font-extrabold text-lg leading-tight">{popupNotice.title || '📢 Notice'}</div>
                                            <div className="text-blue-100 text-xs font-medium mt-0.5">From Admin</div>
                                        </div>
                                    </div>
                                    {/* Animated ping dot */}
                                    <span className="absolute top-4 right-5 flex h-3 w-3">
                                        <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-300 opacity-75"></span>
                                        <span className="relative inline-flex rounded-full h-3 w-3 bg-yellow-400"></span>
                                    </span>
                                </div>
                                {/* Notice text body */}
                                <div className="px-5 py-5">
                                    <div className="bg-blue-50 dark:bg-slate-700/50 rounded-2xl p-4 border border-blue-100 dark:border-slate-600">
                                        <p className="text-sm text-slate-700 dark:text-slate-200 leading-relaxed whitespace-pre-line">{popupNotice.text}</p>
                                    </div>
                                </div>
                                {/* Close button */}
                                <div className="px-5 pb-5">
                                    <button 
                                        onClick={()=>setShowPopupNotice(false)} 
                                        className="w-full py-3 rounded-2xl font-bold text-sm bg-gradient-to-r from-blue-500 to-indigo-600 text-white shadow-lg shadow-blue-200 active:scale-95 transition-all"
                                    >
                                        ✓ Okay, Got it!
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {toast && <div className={`fixed top-5 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl text-xs font-bold z-[100] animate-slide-up flex items-center gap-2 ${toast.type==='error'?'bg-red-500 text-white':'bg-slate-800 text-white'}`}>
                        {toast.type === 'success' && <Icons.Check size={14}/>} {toast.msg}
                    </div>}

                    {showNotifications && (
                        <div className="fixed inset-0 z-[110] flex items-end justify-center bg-black/40 backdrop-blur-sm" onClick={()=>setShowNotifications(false)}>
                            <div className="bg-white w-full max-w-md rounded-t-3xl shadow-2xl p-5 pb-8 animate-slide-up" onClick={e=>e.stopPropagation()}>
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-bold text-lg text-slate-800">Notifications</h3>
                                    <button onClick={()=>setShowNotifications(false)} className="p-1.5 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200"><Icons.ArrowLeft size={18}/></button>
                                </div>
                                {notifications.length === 0 ? (
                                    <div className="text-center py-10 text-gray-400">
                                        <Icons.Speaker size={36} className="mx-auto mb-2 opacity-30"/>
                                        <p className="text-sm">No notifications yet</p>
                                    </div>
                                ) : (
                                    <div className="space-y-3 max-h-[70vh] overflow-y-auto no-scrollbar">
                                        {notifications.map(n => (
                                            <div key={n.id} className={`p-3 rounded-xl border ${n.timestamp > lastViewedNotif ? 'bg-blue-50 border-blue-200' : 'bg-gray-50 border-gray-100'}`}>
                                                <div className="flex items-start gap-2">
                                                    <div className="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center flex-shrink-0 mt-0.5"><Icons.Speaker size={14}/></div>
                                                    <div className="flex-1">
                                                        <div className="font-bold text-sm text-slate-800">{n.title}</div>
                                                        <div className="text-xs text-gray-500 mt-0.5 leading-relaxed">{n.message}</div>
                                                        <div className="text-[10px] text-gray-400 mt-1">{formatTime(n.timestamp)}</div>
                                                    </div>
                                                    {n.timestamp > lastViewedNotif && <span className="w-2 h-2 bg-blue-500 rounded-full flex-shrink-0 mt-1.5"></span>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
